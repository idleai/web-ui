name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Commit to validate before publication
        required: true
        type: string
      dependencies_artifact:
        description: Prepared dependencies to reuse during release verification
        required: false
        type: string
        default: ''
    outputs:
      dependencies_artifact:
        description: Exact dependencies selected for this CI run
        value: ${{ jobs.dependencies.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  dependencies:
    name: Resolve latest compatible releases
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-ui
    outputs:
      artifact_id: ${{ steps.save.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: web-ui
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Select current released dependencies
        if: ${{ !inputs.dependencies_artifact }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_dependencies.py resolve
      - uses: actions/download-artifact@v8
        if: ${{ inputs.dependencies_artifact != '' }}
        with:
          artifact-ids: ${{ inputs.dependencies_artifact }}
          path: web-ui/target
      - name: Restore prepared release dependencies
        if: ${{ inputs.dependencies_artifact != '' }}
        run: python3 scripts/release_dependencies.py restore
      - uses: actions/upload-artifact@v7
        id: save
        with:
          name: released-dependencies
          overwrite: true
          path: web-ui/target/released-dependencies.json
          if-no-files-found: error

  check:
    needs: dependencies
    env:
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/web-ui/target/released-dependencies.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v7
        with:
          path: web-ui
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web-ui -> target"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: web-ui/target
      - name: Restore this build's dependency selection
        run: python3 scripts/release_dependencies.py restore
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: bash scripts/check.sh
      - name: Install browser fixture tools
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - name: Install Chrome
        id: chrome
        run: |
          OUTPUT="$(npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/history-browser")"
          CHROME_EXECUTABLE="$(printf '%s\n' "$OUTPUT" | tail -n 1 | awk '{print $NF}')"
          test -x "$CHROME_EXECUTABLE"
          echo "path=$CHROME_EXECUTABLE" >> "$GITHUB_OUTPUT"
      - run: bash scripts/build-history.sh
      - run: npm run test:history:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - run: bash scripts/build-history-details.sh
      - run: npm run test:history-details:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - run: bash scripts/build-sessions.sh
      - run: npm run test:sessions:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - run: bash scripts/build-projections.sh
      - run: npm run test:projections:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - run: bash scripts/build-navigation.sh
      - run: npm run test:navigation:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
