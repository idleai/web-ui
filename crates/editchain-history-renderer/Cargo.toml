[package]
name = "editchain-history-renderer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser history renderer and host message adapter"
repository = "https://github.com/idleai/web-ui"
readme = "../../README.md"
keywords = ["crdt", "edit-chain", "agent"]
categories = ["data-structures", "database-implementations"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The HistoryApp application core is pure std + serde_json and compiles for
# both native tests and the wasm32 webview target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
history-geometry = { path = "../history-geometry" }
idle-history = { path = "../../../app-core/crates/idle-history" }
editchain-protocol = { path = "../../../app-core/crates/editchain-protocol" }
serde = { version = "1", features = ["derive", "alloc"] }
serde_json = { version = "1" }
wasm-bindgen = { version = "=0.2.127", default-features = false }
wasm-bindgen-futures = { version = "=0.4.77", default-features = false }
js-sys = { version = "=0.3.104", default-features = false }
web-sys = { version = "=0.3.104", default-features = false, features = [
    "CssStyleDeclaration",
    "Document",
    "DocumentFragment",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "FocusOptions",
    "HtmlButtonElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Node",
    "NodeList",
    "Performance",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Text",
    "Window",
    "console",
] }

[dev-dependencies]
history-geometry = { path = "../history-geometry" }
idle-history = { path = "../../../app-core/crates/idle-history" }
editchain-protocol = { path = "../../../app-core/crates/editchain-protocol" }
serde = { version = "1", features = ["derive", "alloc"] }
serde_json = { version = "1" }
