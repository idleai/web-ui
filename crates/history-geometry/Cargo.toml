[package]
publish = ["idle-web-ui"]
name = "history-geometry"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "History graph layout, retained routes, motion and viewport geometry"
repository = "https://github.com/idleai/web-ui"
readme = "../../README.md"
keywords = ["idle", "ui", "application"]
categories = ["gui"]

[dependencies]
editchain-index = { registry = "idle-editchain", version = "0.1.6" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
idle-history = { registry = "idle-host-tools", version = "0.1.0" }
editchain-core = { registry = "idle-editchain", version = "0.1.0" }
serde_json = "1"

[lints]
workspace = true
