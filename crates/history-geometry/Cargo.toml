[package]
name = "history-geometry"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "History graph layout, retained routes, motion and viewport geometry"
repository = "https://github.com/idleai/web-ui"

[dependencies]
editchain-protocol = { path = "../../../app-core/crates/editchain-protocol" }
editchain-project = { path = "../../../app-core/crates/editchain-project" }
editchain-core = { path = "../../../editchain/crates/editchain-core" }
editchain-index = { path = "../../../editchain/crates/editchain-index" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
editchain-engine = { path = "../../../editchain/crates/editchain-engine" }
editchain-import = { path = "../../../editchain/crates/editchain-import" }
editchain-store = { path = "../../../editchain/crates/editchain-store" }
blake3 = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
serde_json = "1"

[lints]
workspace = true
