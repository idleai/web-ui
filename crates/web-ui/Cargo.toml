[package]
publish = ["idle-web-ui"]
name = "web-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Shared Dioxus components for Idle browser and VS Code hosts"
repository = "https://github.com/idleai/web-ui"
readme = "../../README.md"
keywords = ["idle", "ui", "application"]
categories = ["gui"]

[dependencies]
history-geometry = { registry = "idle-web-ui", version = "0.2.0", path = "../history-geometry" }
app-core = { registry = "idle-app-core", version = "0.1.0" }
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }

[dev-dependencies]
app-core = { registry = "idle-app-core", version = "0.1.0", features = ["session-fixtures", "resource-fixtures"] }
dioxus-ssr = { version = "=0.7.10", default-features = false }
dioxus-html = { version = "=0.7.10", default-features = false, features = ["serialize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = ["Window", "Performance", "Document", "Element", "NodeList", "HtmlElement", "ScrollToOptions", "ScrollBehavior", "FocusOptions", "KeyboardEvent", "MouseEvent", "EventTarget", "DomTokenList"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
dioxus-web = { version = "=0.7.10", default-features = false, features = ["mounted"] }
wasm-bindgen = "=0.2.127"

[[example]]
name = "foundations"
crate-type = ["cdylib"]

[[example]]
name = "history"
crate-type = ["cdylib"]

[[example]]
name = "history_details"
crate-type = ["cdylib"]

[[example]]
name = "sessions"
crate-type = ["cdylib"]

[[example]]
name = "projections"
crate-type = ["cdylib"]

[[example]]
name = "navigation"
crate-type = ["cdylib"]

[lints]
workspace = true
