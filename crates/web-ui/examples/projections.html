<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idle projection preview</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="projections.css">
<style>
body { margin:0; background:#eef0f3; }
.projection-gallery { max-width:1660px; margin:auto; padding:24px; }
.projection-gallery > .idle-theme { padding:24px; border-radius:8px; margin-bottom:24px; }
.fixture-heading h1 { font-size:32px; margin:8px 0; }
.fixture-heading p { color:var(--idle-color-muted); margin:8px 0; }
.fixture-heading p:first-child,.fixture-kicker { font-size:11px; font-weight:600; letter-spacing:0.12em; }
.fixture-toolbar { display:flex; flex-wrap:wrap; align-items:start; gap:24px; margin-top:24px; }
.fixture-toolbar > .idle-field { flex:0 1 180px; }
.fixture-actions { display:flex; flex-wrap:wrap; gap:8px; flex:1 1 400px; }
.fixture-events { margin-top:16px; }
.fixture-events pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
.fixture-standalone { margin-top:16px; }
.fixture-standalone > div { width:min(100%, 288px); margin-top:24px; }
.fixture-compositions { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:24px; align-items:start; }
.fixture-compositions > .idle-theme { min-width:0; border-radius:8px; }
.fixture-browser,.fixture-sidebar { padding:24px; display:grid; gap:28px; min-width:0; }
.fixture-sidebar { padding:14px; }
.fixture-kicker { margin:0; color:var(--idle-color-muted); }
.fixture-compositions .idle-projection-panel + .idle-projection-panel { border-top:1px solid var(--idle-color-hairline); padding-top:24px; }
@media(max-width:900px) { .fixture-compositions { grid-template-columns:minmax(0,1fr); } .projection-gallery { padding:12px; } .fixture-browser { padding:16px; } }
</style>
<div id="main"></div>
<script type="module" src="loader.js"></script>
</html>
